id: user_correction
version: 4
source: design-doc
question: After the first request, did the user have to correct the agent's work or understanding?
kind: choice
scope: trace
labels:
  none: Every follow-up message is a new request, an approval, more information, or a question. The user never says the agent got something wrong.
  minor: The user asks for small adjustments to work that was otherwise right, such as a rename, a tweak to a value, or a style fix.
  major: The agent misunderstood the task or went the wrong way, and the user had to redirect it or ask it to undo or revert its work.
code_labels:
  none: Assigned by code when the session has only one user message.
extractor: user_correction
evidence: Every user message after the first, each preceded by the last ~500 tokens of the assistant message before it.
budget_tokens: 4000
threshold: 0.5
admitted: false
sufficiency_risk: low
# Jev answers two questions per follow-up; code takes the most severe one
# (judges/aggregate.py: correction_severity).
jev_items:
  items: follow_ups
  context: [first_request]
  aggregate: correction_severity
  questions:
    corrects:
      instructions: Does this user message tell the agent that something it did or said is wrong?
      "true": The user points out a mistake, says the result is not what they wanted, or asks the agent to change or undo something it did.
      "false": The user approves, says to continue, asks a question, gives information, or makes a new request that does not say earlier work was wrong.
    redirects:
      instructions: Does this user message say the agent misunderstood the task or took the wrong approach?
      "true": The user sends the agent toward a different goal or approach, or asks it to revert its work.
      "false": The user keeps the agent's direction. Any change asked for is a small adjustment, such as a rename, a different value, or a style fix.
